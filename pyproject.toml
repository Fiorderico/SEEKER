[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seeker-conformer"
version = "1.0.0"
description = "Multi-objective genetic conformer search with quaternion torsions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
discovery = ["scikit-learn>=1.3", "scipy>=1.10"]
pyscf = ["pyscf>=2.5"]

[project.scripts]
seeker = "seeker.cli:main"

[tool.setuptools.packages.find]
include = ["seeker*"]
