name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[discovery]'
      - run: seeker --version
      - run: seeker doctor
      - run: >-
          seeker run --xyz examples/glycine/input.xyz
          --genes examples/glycine/genes.txt
          --output runs/ci-validation --validate-only --no-tui
      - run: >-
          seeker launch --xyz examples/glycine/input.xyz
          --genes examples/glycine/genes.txt
          --output runs/ci-dry-run --backend xtb
          --validate-only --non-interactive --dry-run --no-tui

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[discovery]'
      - run: seeker --version
      - run: seeker doctor
      - run: >-
          seeker run --xyz examples/glycine/input.xyz
          --genes examples/glycine/genes.txt
          --output runs/ci-validation --validate-only --no-tui
      - run: >-
          seeker launch --xyz examples/glycine/input.xyz
          --genes examples/glycine/genes.txt
          --output runs/ci-dry-run --backend xtb
          --validate-only --non-interactive --dry-run --no-tui
